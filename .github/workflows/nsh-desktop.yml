name: NSH native desktop acceptance
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Build signed production artifacts from a version tag
        type: boolean
        default: false
  push:
    branches: [rewrite/nsh-desktop]
  pull_request:
    paths: ['desktop/**', 'src/**', 'assets/data/**', '.github/workflows/nsh-desktop.yml', 'scripts/build-nsh-windows.ps1']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows
            archive: nsh-windows-x86_64.zip
          - runner: macos-15
            target: macos
            archive: nsh-macos-arm64.tar.gz
          - runner: ubuntu-24.04
            target: linux
            archive: nsh-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.distribution && github.ref_type == 'tag' && matrix.target == 'macos' && 'desktop-release' || 'desktop-ci' }}
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      NSH_ARCHIVE: ${{ matrix.archive }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/nsh-cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      BING_WALLPAPER_UPDATE_PUBLIC_KEY: ${{ vars.BING_WALLPAPER_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check production build inputs
        if: inputs.distribution
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./desktop/nsh.json").version')
          [[ "$GITHUB_REF" == "refs/tags/v$version" && -n "$BING_WALLPAPER_UPDATE_PUBLIC_KEY" ]]
      - name: Configure Developer ID signing for a distribution build
        if: inputs.distribution && matrix.target == 'macos' && github.ref_type == 'tag'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          ISSUER: ${{ vars.MACOS_NOTARY_ISSUER }}
          IDENTITY: ${{ vars.MACOS_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          : "${IDENTITY:?Missing Developer ID Application identity}"
          umask 077
          keychain="$RUNNER_TEMP/wallpaper-signing.keychain-db"
          cert="$RUNNER_TEMP/wallpaper-signing.p12"
          key="$RUNNER_TEMP/wallpaper-notary.p8"
          trap 'rm -f "$cert" "$key"' EXIT
          printf %s "$P12" | base64 -D > "$cert"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials BingWallpaperNotary --key "$key" --issuer "$ISSUER" --key-id "$KEY_ID"
          printf 'MACOS_DEVELOPER_ID=%s\nMACOS_NOTARY_PROFILE=BingWallpaperNotary\n' "$IDENTITY" >> "$GITHUB_ENV"
      - name: Install pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download v0.7.2 --repo longbridge/nsh --pattern "$NSH_ARCHIVE" --pattern "$NSH_ARCHIVE.sha256"
          if command -v sha256sum >/dev/null; then sha256sum -c "$NSH_ARCHIVE.sha256"; else shasum -a 256 -c "$NSH_ARCHIVE.sha256"; fi
          if [[ "$NSH_ARCHIVE" == *.zip ]]; then unzip -qo "$NSH_ARCHIVE"; else tar -xf "$NSH_ARCHIVE"; fi
          echo "$RUNNER_TEMP/nsh/bin" >> "$GITHUB_PATH"
      - name: Prepare Linux native build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libssl-dev libxdo-dev libfuse2t64 xvfb dbus-x11 x11-utils
          gh release download continuous --repo AppImage/appimagetool --pattern appimagetool-x86_64.AppImage --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          echo "NSH_APPIMAGETOOL=$RUNNER_TEMP/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Include Intel in the macOS universal package
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Package portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-nsh-windows.ps1 -SkipCheck
      - name: Package native application with the headless wallpaper task
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-nsh-unix.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: target/nsh-release/*
          if-no-files-found: error
      - name: Test native extension
        run: cargo test --locked --manifest-path desktop/ext/wallpaper-native/Cargo.toml
      - name: Open the packaged Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            export XDG_CONFIG_HOME="$RUNNER_TEMP/installed-config" XDG_DATA_HOME="$RUNNER_TEMP/installed-data"
            export XDG_CACHE_HOME="$RUNNER_TEMP/installed-cache" XDG_CURRENT_DESKTOP=GNOME
            image=(target/nsh-release/*.AppImage)
            log="$RUNNER_TEMP/installed-linux-window.log"
            BING_WALLPAPER_CONFIRM_WINDOW=1 setsid "${image[0]}" >"$log" 2>&1 &
            pid=$!
            trap "kill -- -$pid 2>/dev/null || true" EXIT
            version=$(node -p "require(\"./desktop/nsh.json\").version")
            for i in {1..90}; do
              if grep -Fq "BING-WALLPAPER-WINDOW-READY $version" "$log" && xwininfo -root -tree | grep -F "必应每日壁纸库" >/dev/null; then exit 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "$log"; exit 1'
      - name: Open the standalone Windows exe with outbound access blocked
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-nsh-portable.ps1 -Exe (Get-Item target/nsh-release/*.exe).FullName -Offline
      - name: Check native extension
        run: cargo clippy --locked --manifest-path desktop/ext/wallpaper-native/Cargo.toml --all-targets -- -D warnings
      - name: Verify anonymous release comparison and manifest signing
        run: node --test scripts/sign-desktop-release.test.mjs
      - name: Check and test TSX
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          nsh check
          nsh test App.test.tsx
          nsh test Archive.headless.test.tsx
          nsh test Downloads.headless.test.tsx
          cd ..
          node scripts/test-nsh-migration.mjs
      - name: Exercise the native window and apply a Bing wallpaper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/nsh-validation
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get install -y gsettings-desktop-schemas
            xvfb-run -a dbus-run-session -- bash -euc '
              export XDG_CURRENT_DESKTOP=GNOME
              nsh test desktop/App.tsx --target linux < scripts/test-nsh-desktop.mjs
              for key in picture-uri picture-uri-dark; do
                value=$(gsettings get org.gnome.desktop.background "$key")
                [[ "$value" == *BingWallpaperLib/Wallpapers/*.jpg* ]]
              done'
          else
            nsh test desktop/App.tsx --target ${{ matrix.target }} --foreground < scripts/test-nsh-desktop.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-window-${{ matrix.target }}
          path: target/nsh-validation/*.png
          if-no-files-found: ignore
      - name: Verify Plasma wallpaper on a running desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends plasma-desktop plasma-workspace kwin-x11 kactivitymanagerd
          xvfb-run -a dbus-run-session -- bash scripts/test-nsh-plasma.sh
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: native-window-kde
          path: target/nsh-validation/*.png
          if-no-files-found: error
  open-universal-package:
    needs: package
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: package
      - name: Open the same packaged application on the native architecture
        shell: bash
        run: |
          set -euo pipefail
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/BingDMG" package/*.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/BingDMG" -quiet || true' EXIT
          ditto "$RUNNER_TEMP/BingDMG/BingWallpaperLib.app" "$RUNNER_TEMP/BingWallpaperLib.app"
          app="$RUNNER_TEMP/BingWallpaperLib.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          binary="$app/Contents/MacOS/$executable"
          lipo "$binary" -verify_arch arm64 x86_64
          "$binary" > "$RUNNER_TEMP/window.log" 2>&1 &
          app_pid=$!
          swift - "$app_pid" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let pid = Int(CommandLine.arguments[1])!
          for _ in 0..<90 {
            let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
            if windows.contains(where: { ($0[kCGWindowOwnerPID as String] as? Int) == pid && ($0[kCGWindowLayer as String] as? Int) == 0 }) { exit(0) }
            Thread.sleep(forTimeInterval: 0.5)
          }
          exit(1)
          SWIFT
          kill "$app_pid"
