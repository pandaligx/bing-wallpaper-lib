name: Verify wallpaper on a running GNOME desktop
on: workflow_call
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a nested GNOME Shell desktop
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends gnome-shell gsettings-desktop-schemas dbus-x11 xvfb xauth imagemagick python3-pil libgl1-mesa-dri libwebkitgtk-6.0-4 libgtk-4-1
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/appimage
      - name: Set and observe the background with the tested AppImage
        run: |
          set -euo pipefail
          images=("$RUNNER_TEMP"/appimage/*.AppImage)
          test "${#images[@]}" = 1
          chmod +x "${images[0]}"
          xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX' dbus-run-session -- bash scripts/test-gnome-session.sh "${images[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-shell-wallpaper
          path: ${{ runner.temp }}/gnome-evidence/
          if-no-files-found: ignore
