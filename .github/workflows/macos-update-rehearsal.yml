name: Verify macOS development update rejection
on:
  push:
    branches: [validation/macos-update]
  workflow_dispatch:
    inputs:
      tag:
        description: Published development release to test
        default: v0.3.0-rc.1
        required: true
permissions:
  contents: read
jobs:
  macos-update:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RC_TAG: ${{ inputs.tag || 'v0.3.0-rc.1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and exercise the published DMG
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC_TAG")
          jq -e '.prerelease and (.draft | not)' <<< "$release" >/dev/null
          name="BingWallpaperLib-${RC_TAG%-rc.*}-macos-universal.dmg"
          sha=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest | ltrimstr("sha256:")' <<< "$release")
          gh release download "$RC_TAG" --pattern "$name" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' "$sha" "$name" | shasum -a 256 -c -)
          node scripts/test-macos-update-rejection.mjs "$RUNNER_TEMP/$name"
