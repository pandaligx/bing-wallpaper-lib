name: Sync wallpaper archive

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2-23/4 * * *"

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARCHIVE_SOURCE_URL: https://raw.githubusercontent.com/zxyongyo/bing-daily-wallpaper/master/map.json
      ARCHIVE_TARGET_PATH: assets/data/zxyongyo-bing-wallpaper.json
      ARCHIVE_CORRECTIONS_PATH: assets/data/zxyongyo-bing-wallpaper-corrections.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and validate archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$ARCHIVE_SOURCE_URL" -o /tmp/zxyongyo-bing-wallpaper.json
          node <<'NODE'
          const fs = require("fs");
          const source = "/tmp/zxyongyo-bing-wallpaper.json";
          const target = process.env.ARCHIVE_TARGET_PATH;
          const correctionsPath = process.env.ARCHIVE_CORRECTIONS_PATH;
          const data = JSON.parse(fs.readFileSync(source, "utf8"));
          if (!data || !Array.isArray(data.images) || data.images.length < 1000) {
            throw new Error("Wallpaper archive does not look valid.");
          }

          const corrections = JSON.parse(fs.readFileSync(correctionsPath, "utf8"));
          if (!corrections || !Array.isArray(corrections.images)) {
            throw new Error("Wallpaper archive corrections do not look valid.");
          }

          const imagesByDate = new Map(data.images.map((image) => [image.date, image]));
          for (const image of corrections.images) {
            if (!image.date || !image.url_4k) {
              throw new Error("Wallpaper archive correction is missing required fields.");
            }
            imagesByDate.set(image.date, image);
          }
          data.images = [...imagesByDate.values()].sort((a, b) => b.date.localeCompare(a.date));
          fs.writeFileSync(target, JSON.stringify(data));
          NODE

      - name: Commit archive update
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$ARCHIVE_TARGET_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARCHIVE_TARGET_PATH"
          git commit -m "chore: sync wallpaper archive"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  mirror:
    needs: sync
    uses: ./.github/workflows/mirror-to-gitcode.yml
    secrets: inherit
