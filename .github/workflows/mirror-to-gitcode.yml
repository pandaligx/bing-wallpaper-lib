name: Verify GitCode source mirror
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: mirror-gitcode
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Wait for the public pull mirror to contain main and release tags
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          origin=https://github.com/pandaligx/bing-wallpaper-lib.git
          mirror=https://gitcode.com/gcw_qWIjmve7/bing-wallpaper-lib.git
          for attempt in {1..60}; do
            git ls-remote --refs "$origin" refs/heads/main 'refs/tags/v*' | sort > "$RUNNER_TEMP/origin-refs"
            if git ls-remote --refs "$mirror" refs/heads/main 'refs/tags/v*' | sort > "$RUNNER_TEMP/mirror-refs" &&
               test -s "$RUNNER_TEMP/origin-refs" &&
               comm -23 "$RUNNER_TEMP/origin-refs" "$RUNNER_TEMP/mirror-refs" > "$RUNNER_TEMP/missing-refs" &&
               test ! -s "$RUNNER_TEMP/missing-refs"; then
              echo "Public main and release tags match on both sites"
              exit 0
            fi
            sleep 60
          done
          echo "::error::The public GitCode mirror is missing GitHub refs after one hour"
          cat "$RUNNER_TEMP/missing-refs" || true
          exit 1
